name: Linux Portable Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Console/GARbro.Console.Portable.csproj

      - name: Build
        run: dotnet build Console/GARbro.Console.Portable.csproj -c Release --no-restore

      - name: Smoke test
        run: dotnet Console/bin/Release/net8.0/GARbro.Console.dll -l

      - name: Publish
        run: dotnet publish Console/GARbro.Console.Portable.csproj -c Release --no-restore -r linux-x64 --self-contained false -o artifacts/linux-portable

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GARbro-Linux-Portable
          path: artifacts/linux-portable
