name: Linux Build

on:
  push:
    branches:
      - linux-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore CLI
        run: dotnet restore Console/GARbro.Console.Portable.csproj -r linux-x64

      - name: Restore GUI
        run: dotnet restore GUI.Linux/GARbro.GUI.Linux.csproj -r linux-x64

      - name: Build CLI
        run: dotnet build Console/GARbro.Console.Portable.csproj -c Release --no-restore

      - name: Build GUI
        run: dotnet build GUI.Linux/GARbro.GUI.Linux.csproj -c Release --no-restore

      - name: Smoke test
        run: dotnet Console/bin/Release/net8.0/GARbro.Console.dll -l

      - name: Publish Linux CLI
        run: dotnet publish Console/GARbro.Console.Portable.csproj -c Release --no-restore -r linux-x64 --self-contained false -o artifacts/linux-portable

      - name: Publish Linux GUI
        run: dotnet publish GUI.Linux/GARbro.GUI.Linux.csproj -c Release --no-restore -r linux-x64 --self-contained false -o artifacts/linux-gui

      - name: Package Linux portable
        run: |
          cd artifacts/linux-portable
          zip -r ../GARbro-Linux-Portable.zip .

      - name: Package Linux GUI
        run: |
          cd artifacts/linux-gui
          zip -r ../GARbro-Linux-GUI.zip .

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARbro-Linux-Portable
          path: artifacts/GARbro-Linux-Portable.zip

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARbro-Linux-GUI
          path: artifacts/GARbro-Linux-GUI.zip

      - name: Move dev tag
        if: github.event_name == 'push'
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Publish dev prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: GARbro Linux dev
          body: |
            Automated Linux prerelease from `${{ github.sha }}`.

            Assets:
            - GARbro-Linux-GUI.zip: Avalonia Linux GUI.
            - GARbro-Linux-Portable.zip: command-line portable build.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            artifacts/GARbro-Linux-GUI.zip
            artifacts/GARbro-Linux-Portable.zip
