name: Linux Portable Build

on:
  push:
    branches:
      - linux-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-portable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Console/GARbro.Console.Portable.csproj -r linux-x64

      - name: Build
        run: dotnet build Console/GARbro.Console.Portable.csproj -c Release --no-restore

      - name: Smoke test
        run: dotnet Console/bin/Release/net8.0/GARbro.Console.dll -l

      - name: Publish Linux portable
        run: dotnet publish Console/GARbro.Console.Portable.csproj -c Release --no-restore -r linux-x64 --self-contained false -o artifacts/linux-portable

      - name: Package Linux portable
        run: |
          cd artifacts/linux-portable
          zip -r ../GARbro-Linux-Portable.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARbro-Linux-Portable
          path: artifacts/GARbro-Linux-Portable.zip

      - name: Move dev tag
        if: github.event_name == 'push'
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Publish dev prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: GARbro Linux Portable dev
          body: |
            Automated Linux portable prerelease from `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          replace_files: true
          files: artifacts/GARbro-Linux-Portable.zip
